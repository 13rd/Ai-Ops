# Server Simulator Configuration
# ==============================
# Настройки симулятора сервера для генерации реалистичных данных

server:
  name: "normal-server-1"
  cpu_cores: 8
  memory_gb: 32
  disk_gb: 500
  swap_gb: 4

services:
  # Веб-сервер (например, nginx/gunicorn)
  web:
    enabled: true
    instances: 4
    base_cpu_percent: 15.0
    base_memory_mb: 256.0
    base_network_in_kbps: 500.0
    base_network_out_kbps: 2000.0
    cpu_noise_std: 3.0
    memory_noise_std: 10.0
    seasonal_amplitude: 0.5

  # База данных (например, PostgreSQL)
  database:
    enabled: true
    instances: 1
    base_cpu_percent: 12.0
    base_memory_mb: 1024.0
    base_disk_read_kbps: 5000.0
    base_disk_write_kbps: 2000.0
    base_network_in_kbps: 100.0
    base_network_out_kbps: 200.0
    cpu_noise_std: 4.0
    seasonal_amplitude: 0.4

  # Фоновые воркеры (например, Celery)
  worker:
    enabled: true
    instances: 2
    base_cpu_percent: 8.0
    base_memory_mb: 512.0
    cpu_noise_std: 8.0
    seasonal_amplitude: 0.2

  # Кеш (например, Redis)
  cache:
    enabled: true
    instances: 1
    base_cpu_percent: 2.0
    base_memory_mb: 512.0
    base_network_in_kbps: 2000.0
    base_network_out_kbps: 1000.0
    cpu_noise_std: 1.0
    seasonal_amplitude: 0.1

seasonality:
  # Час пик в сутках (0-23)
  daily_peak_hour: 14
  # День пик в неделе (0=Mon, 6=Sun)
  weekly_peak_day: 3
  # Амплитуда сезонности (0-1)
  amplitude: 0.4
  # Множитель для выходных
  weekend_multiplier: 0.6
  # Шум метрик
  noise_std: 2.0

auto_anomaly:
  enabled: false
  min_interval_minutes: 30
  max_interval_minutes: 90
  min_duration_minutes: 3
  max_duration_minutes: 12
  types:
    - cpu_spike
    - memory_leak
    - service_down
    - container_crash
    - disk_fill
    - network_storm

collection_interval_sec: 1.0
metrics_emit_interval_sec: 15.0
listen_host: "0.0.0.0"
listen_port: 8101
