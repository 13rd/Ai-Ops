[project]
name = "server-monitor-backend"
version = "0.1.0"
description = "Server monitoring backend"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.6",
    "paramiko>=3.4.0",
    "psutil>=5.9.8",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pydantic[email]>=2.5.0",
    "aiosqlite>=0.19.0",
    "pandas>=2.1",
    "cryptography>=42.0.0",
    "redis>=5.0.0",
    "httpx>=0.26.0",
    "tensorflow==2.16.2",
    "scikit-learn>=1.4",
    "shap==0.45.1",
    "joblib>=1.3",
    "numpy>=1.26,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.26.0",
    "ruff>=0.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
